name: Relevé des prix
# Relevé à la demande (onglet Actions, « Run workflow »). Pour le remettre toutes les heures, ajouter :
#   schedule:
#     - cron: "23 * * * *"
on:
  workflow_dispatch:
    inputs:
      diag:
        description: "Diagnostic (compte rendu sur la branche diag, sans publier)"
        type: boolean
        default: false
      only:
        description: "Diagnostic : enseignes à relire (par exemple auchan)"
        type: string
        default: ""
permissions:
  contents: write
  pages: write
concurrency:
  group: releve-prix
  cancel-in-progress: false
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever, reconstruire, publier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG: ${{ inputs.diag || 'false' }}
          ONLY: ${{ inputs.only }}
        run: bash tools/ci.sh
