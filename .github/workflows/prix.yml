name: Relevé des prix
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      diag:
        description: "Diagnostic (compte rendu sur la branche diag, sans publier)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: releve-prix
  cancel-in-progress: false
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever, reconstruire, publier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG: ${{ inputs.diag || 'false' }}
        run: bash tools/ci.sh
